[project]
name = "automacao-artigos"
version = "0.1.0"
description = "CLI tool to generate Medium-style articles from markdown annotations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agno>=2.0",
    "openai>=1.0",
    "typer>=0.9",
    "python-frontmatter>=1.0",
    "rich>=13.0",
    "httpx>=0.27",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[project.scripts]
artigo = "src.main:app"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.uv]
package = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "PL", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that take longer to run",
    "events: tests related to event handling",
]
